<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <div class="calculadora">
        <div class="tela">
            
        </div>

        <div class="teclado">
            <div class="teclas"id="num7">7</div>
            <div class="teclas"id="num8">8</div>
            <div class="teclas"id="num9">9</div>
            <div class="teclas"id="divisao">÷</div>
            <div class="teclas"id="num4">4</div>
            <div class="teclas"id="num5">5</div>
            <div class="teclas"id="num6">6</div>
            <div class="teclas"id="multiplicacao">X</div>
            <div class="teclas"id="num1">1</div>
            <div class="teclas"id="num2">2</div>
            <div class="teclas"id="num3">3</div>
            <div class="teclas"id="subtracao">-</div>
            <div class="teclas"id="num0">0</div>
            <div class="teclas"id="virgula">,</div>
            <div class="teclas"id="igual">=</div>
            <div class="teclas"id="adicao">+</div>
        </div>
    </div>


    <script src="script.js"></script>
